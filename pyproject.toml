[project]
name = "sar-log"
dynamic = ["version"]
description = "Local job, person-hours and training log for a SAR group"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "waitress>=3.0"]

[project.optional-dependencies]
# quickjs runs the browser sorting script in tests; they are skipped without it.
test = ["pytest>=8", "quickjs>=1.19"]
import = ["openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "sar_log.__version__"}

[tool.setuptools.packages.find]
include = ["sar_log*"]

[tool.setuptools.package-data]
sar_log = ["schema.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
